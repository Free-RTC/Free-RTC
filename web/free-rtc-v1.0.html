<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free-RTC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
:root{--bg:#11141b;--panel:#1a1f2b;--line:#2a3142;--ink:#e9ecf2;--dim:#8d96a8;--acc:#4c8dff;--ok:#3ddc97;--bad:#ff5d5d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.off{background:#3a1d24;border-color:var(--bad);color:#ffd2d2}
button.on{border-color:var(--ok)}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=color]{padding:2px;width:46px;height:42px;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.row>input:not([type=color]){flex:1;min-width:0}
#land{margin:auto;width:min(92vw,400px);display:flex;flex-direction:column;gap:12px}
#land h1{font-size:2.6rem;font-weight:800;margin:0;letter-spacing:-.03em}
#land p{margin:0;color:var(--dim)}
#code{max-width:110px;text-align:center;font-size:1.2rem;letter-spacing:.2em}
#app{display:none;flex:1;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
header b{font-weight:800;font-size:1.1rem}
header span{color:var(--dim);flex:1}
main{flex:1;display:flex;min-height:0}
#roster{width:300px;flex:none;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line)}
.card{--c:var(--acc);border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel));border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.card.speak{box-shadow:0 0 0 2px var(--ok)}
.card .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .st{color:var(--bad);font-size:.8rem}
.card button{padding:4px 10px;font-size:.85rem}
.card input[type=range]{flex:1;min-width:0;accent-color:var(--c)}
#stage{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:10px;padding:10px;overflow:auto;align-content:start;position:relative}
#hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);text-align:center;padding:20px;pointer-events:none}
.vt{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.vt video{width:100%;height:100%;object-fit:contain;display:block}
.vt.me.cam video{transform:scaleX(-1)}
.vt span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);padding:2px 10px;border-radius:99px;font-size:.85rem}
#bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.panel{display:none;position:fixed;bottom:74px;left:50%;transform:translateX(-50%);width:min(92vw,420px);max-height:55vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;flex-direction:column;gap:10px;z-index:5}
.panel.open{display:flex}
#sounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
#sounds div{display:flex}
#sounds .s{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:10px 0 0 10px}
#sounds .x{border-radius:0 10px 10px 0;padding:4px 9px;color:var(--bad)}
@media(max-width:760px){main{flex-direction:column}#roster{width:auto;max-height:38%;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div id="land">
  <h1>Free-RTC</h1>
  <p>Voice, video and screen share for up to 10 people.</p>
  <div class="row"><input id="name" placeholder="Your name" maxlength="20" autocomplete="nickname"><input id="color" type="color" title="Your color"></div>
  <input id="pw" type="password" placeholder="Room password (optional)" autocomplete="off">
  <button class="pri" id="create">Create room</button>
  <div class="row"><input id="code" placeholder="000" inputmode="numeric" maxlength="3"><button id="join">Join room</button></div>
</div>

<div id="app">
  <header><b>Free-RTC</b><span id="rn"></span><button id="copy">Copy room code</button></header>
  <main><div id="roster"></div><div id="stage"><div id="hint">Nobody is on screen.<br>Use Watch next to a member to see their video or stream.</div></div></main>
  <div id="bar">
    <button id="mic">Mute</button>
    <button id="deaf">Deafen</button>
    <button id="cam">Start video</button>
    <button id="scr">Share screen</button>
    <button id="sbb">Soundboard</button>
    <button id="stb">Settings</button>
    <button id="leave">Leave</button>
  </div>
  <div class="panel" id="sbp">
    <div class="row"><label class="row" style="flex:1">Volume <input id="sbv" type="range" min="0" max="1" step=".05" value="1" style="flex:1"></label><button id="sbs">Stop all</button></div>
    <input id="up" type="file" accept="audio/*" multiple>
    <div id="sounds"></div>
  </div>
  <div class="panel" id="stp">
    <label>Video quality you send
      <select id="qsel"><option>Max</option><option>High</option><option>Low</option></select>
    </label>
    <small style="color:var(--dim)">Max is 1080p60, High is 720p30, Low is 480p15. Applies the next time you start video or screen share.</small>
  </div>
  <div id="audio" hidden></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,get,set,push,remove,update,onValue,onChildAdded,onDisconnect,runTransaction}
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyAn6egBxB2dk-wuA3U1tWRbl2f79FBt5xs",authDomain:"free-rtc.firebaseapp.com",databaseURL:"https://free-rtc-default-rtdb.firebaseio.com",projectId:"free-rtc",storageBucket:"free-rtc.firebasestorage.app",messagingSenderId:"981358048231",appId:"1:981358048231:web:212f34bd5ae7a296b44342"};
const ICE={iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]};
const MAX=10;
const Q={Max:[1080,60,1e7,4e6],High:[720,30,4e6,2e6],Low:[480,15,15e5,8e5]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okColor=c=>/^#[0-9a-f]{6}$/i.test(c)?c:"#4c8dff";
const S={name:localStorage.name||"",color:okColor(localStorage.color),q:Q[localStorage.q]?localStorage.q:"Max"};
$("#name").value=S.name;$("#color").value=S.color;$("#qsel").value=S.q;

let db,uid,room,seatRef,ac,micGain,sbGain,queue=Promise.resolve();
const L={mic:true,deaf:false,cam:null,scr:null,scrA:null};
const out={mic:null,sb:null};
const peers={},tiles={},meters={};
let seats={};
const mk=t=>{const e=document.createElement(t);e.autoplay=true;e.playsInline=true;return e};
const meV={cam:mk("video"),scr:mk("video")};
meV.cam.muted=meV.scr.muted=true;

const H=async(r,p)=>{if(!p)return null;const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(r+":"+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")};

function analyser(node){const a=ac.createAnalyser();a.fftSize=512;node.connect(a);a.buf=new Uint8Array(a.fftSize);return a}
function loop(){
  for(const k in meters){
    const a=meters[k];a.getByteTimeDomainData(a.buf);
    let m=0;for(const v of a.buf)m=Math.max(m,Math.abs(v-128));
    const el=document.querySelector(`[data-u="${k}"]`);
    if(el)el.classList.toggle("speak",m>12);
  }
  requestAnimationFrame(loop);
}

async function setupAudio(){
  ac=new AudioContext();
  const ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  micGain=ac.createGain();
  const d0=ac.createMediaStreamDestination();
  ac.createMediaStreamSource(ms).connect(micGain);micGain.connect(d0);
  out.mic=d0.stream.getAudioTracks()[0];
  sbGain=ac.createGain();
  const d1=ac.createMediaStreamDestination();
  sbGain.connect(d1);sbGain.connect(ac.destination);
  out.sb=d1.stream.getAudioTracks()[0];
  meters[uid]=analyser(micGain);
}

const send=(to,type,data)=>push(ref(db,`rooms/${room}/signals/${to}`),{from:uid,type,data:JSON.stringify(data)});
const desc=pc=>({type:pc.localDescription.type,sdp:pc.localDescription.sdp});
const flush=async p=>{while(p.ice.length)await p.pc.addIceCandidate(p.ice.shift()).catch(()=>{})};

function mkPeer(id){
  const p=peers[id]={id,pc:null,ice:[],wants:{},mine:{},vol:1,muted:false,born:Date.now(),seat:seats[id],
    aud:[mk("audio"),mk("audio")],cam:mk("video"),scr:mk("video"),scrS:null};
  p.cam.muted=true;
  $("#audio").append(...p.aud);
  return p;
}
function drop(id){
  const p=peers[id];if(!p)return;
  if(p.pc)p.pc.close();
  p.aud.forEach(a=>a.remove());
  for(const k of ["cam","scr"]){const t=tiles[id+":"+k];if(t){t.remove();delete tiles[id+":"+k]}}
  delete meters[id];delete peers[id];
}

function cap(s,i){
  const x=s.getParameters();
  if(!x.encodings||!x.encodings.length)return;
  const q=Q[S.q];
  x.encodings[0].maxBitrate=[128e3,128e3,q[3],q[2],128e3][i];
  return s.setParameters(x).catch(()=>{});
}
function apply(p){
  if(!p.pc)return;
  const T=[out.mic,out.sb,p.wants.cam?L.cam:null,p.wants.scr?L.scr:null,p.wants.scr?L.scrA:null];
  p.pc.getTransceivers().slice(0,5).forEach((t,i)=>t.sender.replaceTrack(T[i]).then(()=>cap(t.sender,i)).catch(()=>{}));
}
const applyAll=()=>Object.values(peers).forEach(apply);

function connect(p,init){
  const pc=p.pc=new RTCPeerConnection(ICE);
  pc.onicecandidate=e=>e.candidate&&send(p.id,"ice",e.candidate.toJSON());
  pc.ontrack=e=>{
    const i=pc.getTransceivers().indexOf(e.transceiver),ms=new MediaStream([e.track]);
    if(i<2){p.aud[i].srcObject=ms;if(i===0)meters[p.id]=analyser(ac.createMediaStreamSource(ms))}
    else if(i===2)p.cam.srcObject=ms;
    else{p.scrS=p.scrS||new MediaStream();p.scrS.addTrack(e.track);p.scr.srcObject=p.scrS}
    audio();
  };
  pc.onconnectionstatechange=()=>{if(pc.connectionState==="failed"&&init)pc.restartIce()};
  if(init){
    pc.onnegotiationneeded=async()=>{
      await pc.setLocalDescription(await pc.createOffer());
      send(p.id,"offer",desc(pc));
    };
    ["audio","audio","video","video","audio"].forEach(k=>pc.addTransceiver(k,{direction:"sendrecv"}));
    apply(p);
  }
  return pc;
}

async function onSig(m){
  const d=JSON.parse(m.data),p=peers[m.from]||mkPeer(m.from);
  if(m.type==="watch"){p.wants=d;apply(p);return}
  if(m.type==="offer"){
    const pc=p.pc||connect(p,false);
    await pc.setRemoteDescription(d);
    pc.getTransceivers().forEach(t=>t.direction="sendrecv");
    apply(p);await flush(p);
    await pc.setLocalDescription(await pc.createAnswer());
    send(m.from,"answer",desc(pc));
  }else if(!p.pc)return;
  else if(m.type==="answer"){await p.pc.setRemoteDescription(d);await flush(p)}
  else if(p.pc.remoteDescription)await p.pc.addIceCandidate(d).catch(()=>{});
  else p.ice.push(d);
}

function audio(){
  for(const p of Object.values(peers)){
    const m=L.deaf||p.muted;
    [p.aud[0],p.aud[1],p.scr].forEach(e=>{e.muted=m;e.volume=p.vol});
  }
}

let want=new Set();
function put(key,el,label,cls){
  want.add(key);
  let t=tiles[key];
  if(!t){
    t=tiles[key]=document.createElement("div");
    t.className="vt "+cls;
    const s=document.createElement("span");s.textContent=label;
    t.append(el,s);
    t.ondblclick=()=>document.fullscreenElement?document.exitFullscreen():t.requestFullscreen();
  }
  if(!t.isConnected)$("#stage").append(t);
}

function render(){
  const a=document.activeElement;
  if(a&&a.type==="range"&&a.dataset.vol)return;
  $("#mic").textContent=L.mic?"Mute":"Unmute";$("#mic").className=L.mic&&!L.deaf?"":"off";
  $("#deaf").textContent=L.deaf?"Undeafen":"Deafen";$("#deaf").className=L.deaf?"off":"";
  $("#cam").textContent=L.cam?"Stop video":"Start video";$("#cam").className=L.cam?"on":"";
  $("#scr").textContent=L.scr?"Stop sharing":"Share screen";$("#scr").className=L.scr?"on":"";
  $("#roster").innerHTML=Object.values(seats).map(s=>{
    const you=s.uid===uid,p=peers[s.uid];
    return `<div class="card" data-u="${esc(s.uid)}" style="--c:${okColor(s.color)}">
      <div class="row"><span class="nm">${esc(s.name)}${you?" (you)":""}</span><span class="st">${s.deaf?"Deafened":!s.mic?"Muted":""}</span></div>`+
      (you||!p?"":`<div class="row"><input type="range" min="0" max="1" step=".05" value="${p.vol}" data-vol="${esc(s.uid)}" aria-label="Volume"><button data-mute="${esc(s.uid)}" class="${p.muted?"off":""}">${p.muted?"Unmute for me":"Mute for me"}</button></div>`)+
      (!you&&p&&(s.cam||s.scr)?`<div class="row">${s.cam?`<button data-w="${esc(s.uid)}:cam">${p.mine.cam?"Hide video":"Watch video"}</button>`:""}${s.scr?`<button data-w="${esc(s.uid)}:scr">${p.mine.scr?"Hide stream":"Watch stream"}</button>`:""}</div>`:"")+
      `</div>`;
  }).join("");
  want=new Set();
  if(L.cam)put("me:cam",meV.cam,"You (video)","me cam");
  if(L.scr)put("me:scr",meV.scr,"You (screen)","me");
  for(const p of Object.values(peers))for(const k of ["cam","scr"])
    if(p.mine[k]&&p.seat&&p.seat[k])put(p.id+":"+k,p[k],`${p.seat.name} ${k==="cam"?"video":"screen"}`,"");
  for(const k in tiles)if(!want.has(k)){tiles[k].remove();delete tiles[k]}
  $("#hint").hidden=want.size>0;
}

function pub(){
  const on=L.mic&&!L.deaf;
  micGain.gain.value=on?1:0;
  update(seatRef,{mic:on,deaf:L.deaf,cam:!!L.cam,scr:!!L.scr});
  meV.cam.srcObject=L.cam?new MediaStream([L.cam]):null;
  meV.scr.srcObject=L.scr?new MediaStream([L.scr]):null;
  audio();applyAll();render();
}

$("#roster").addEventListener("click",e=>{
  const m=e.target.dataset.mute,w=e.target.dataset.w;
  if(m&&peers[m]){peers[m].muted=!peers[m].muted;audio();render()}
  if(w){
    const [id,k]=w.split(":"),p=peers[id];if(!p)return;
    p.mine[k]=!p.mine[k];
    send(id,"watch",p.mine);render();
  }
});
$("#roster").addEventListener("input",e=>{
  const v=e.target.dataset.vol;
  if(v&&peers[v]){peers[v].vol=+e.target.value;audio()}
});
$("#roster").addEventListener("change",render);

$("#mic").onclick=()=>{L.mic=!L.mic;pub()};
$("#deaf").onclick=()=>{L.deaf=!L.deaf;pub()};
$("#cam").onclick=async()=>{
  try{
    if(L.cam){L.cam.stop();L.cam=null}
    else{const q=Q[S.q];L.cam=(await navigator.mediaDevices.getUserMedia({video:{height:{ideal:q[0]},frameRate:{ideal:Math.min(q[1],30)}}})).getVideoTracks()[0]}
  }catch(e){return alert("Camera unavailable: "+e.message)}
  pub();
};
function stopScr(){if(L.scr)L.scr.stop();if(L.scrA)L.scrA.stop();L.scr=L.scrA=null}
$("#scr").onclick=async()=>{
  if(L.scr){stopScr();return pub()}
  try{
    const q=Q[S.q],m=await navigator.mediaDevices.getDisplayMedia({video:{height:{ideal:q[0]},frameRate:{ideal:q[1]}},audio:true});
    L.scr=m.getVideoTracks()[0];L.scr.contentHint="detail";
    L.scrA=m.getAudioTracks()[0]||null;
    L.scr.onended=()=>{stopScr();pub()};
  }catch{return}
  pub();
};
$("#copy").onclick=()=>navigator.clipboard.writeText(room);
$("#sbb").onclick=()=>{$("#stp").classList.remove("open");$("#sbp").classList.toggle("open")};
$("#stb").onclick=()=>{$("#sbp").classList.remove("open");$("#stp").classList.toggle("open")};
$("#qsel").onchange=e=>{S.q=e.target.value;localStorage.q=S.q;applyAll()};
$("#leave").onclick=async()=>{
  if(seatRef)await remove(seatRef).catch(()=>{});
  location.reload();
};
addEventListener("keydown",e=>{
  if(!seatRef||/INPUT|SELECT/.test(e.target.tagName))return;
  if(e.key==="m"){L.mic=!L.mic;pub()}
  if(e.key==="d"){L.deaf=!L.deaf;pub()}
});

const idb=new Promise((res,rej)=>{
  const r=indexedDB.open("free-rtc",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("s",{keyPath:"id",autoIncrement:true});
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});
const tx=async(mode,f)=>{
  const d=await idb;
  return new Promise((res,rej)=>{
    const t=d.transaction("s",mode),r=f(t.objectStore("s"));
    t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);
  });
};
const bufs={},live=new Set();
async function listSounds(){
  const all=await tx("readonly",s=>s.getAll());
  $("#sounds").innerHTML=all.map(x=>`<div><button class="s" data-p="${x.id}">${esc(x.name)}</button><button class="x" data-d="${x.id}" aria-label="Delete">x</button></div>`).join("")||"<small>Upload audio files to build your soundboard.</small>";
}
async function play(id){
  if(!ac)return;
  if(!bufs[id]){
    const x=await tx("readonly",s=>s.get(id));if(!x)return;
    bufs[id]=await ac.decodeAudioData(await x.blob.arrayBuffer());
  }
  const n=ac.createBufferSource();n.buffer=bufs[id];n.connect(sbGain);
  live.add(n);n.onended=()=>live.delete(n);n.start();
}
$("#sounds").addEventListener("click",async e=>{
  if(e.target.dataset.p)play(+e.target.dataset.p);
  if(e.target.dataset.d){const id=+e.target.dataset.d;await tx("readwrite",s=>s.delete(id));delete bufs[id];listSounds()}
});
$("#up").onchange=async e=>{
  for(const f of e.target.files){
    if(f.size>8e6){alert(f.name+" is over 8 MB.");continue}
    await tx("readwrite",s=>s.add({name:f.name.replace(/\.[^.]+$/,""),blob:f}));
  }
  e.target.value="";listSounds();
};
$("#sbv").oninput=e=>{sbGain.gain.value=+e.target.value};
$("#sbs").onclick=()=>live.forEach(n=>n.stop());

async function claim(){
  for(let i=0;i<MAX;i++){
    const r=ref(db,`rooms/${room}/seats/${i}`);
    try{
      const x=await runTransaction(r,c=>c?undefined:{uid,name:S.name,color:S.color,mic:true,deaf:false,cam:false,scr:false});
      if(x.committed){seatRef=r;onDisconnect(r).remove();return 1}
    }catch{}
  }
  return (await get(ref(db,`rooms/${room}/seats`))).size>=MAX?-1:0;
}

async function go(create){
  S.name=$("#name").value.trim()||"Guest";S.color=okColor($("#color").value);
  localStorage.name=S.name;localStorage.color=S.color;
  const pw=$("#pw").value;
  room=null;
  if(!create){
    room=$("#code").value.trim();
    if(!/^\d{1,3}$/.test(room))return alert("Enter a room code from 000 to 999.");
    room=room.padStart(3,"0");
  }
  try{
    if(!db){
      const app=initializeApp(firebaseConfig);
      uid=(await signInAnonymously(getAuth(app))).user.uid;
      db=getDatabase(app);
    }
    await setupAudio();
  }catch(e){return alert("Could not start: "+e.message)}
  if(create){
    for(let t=0;t<40&&!room;t++){
      const id=String(Math.floor(Math.random()*1000)).padStart(3,"0");
      if((await get(ref(db,`rooms/${id}/seats`))).exists())continue;
      try{await set(ref(db,`rooms/${id}/pw`),await H(id,pw));room=id}catch{}
    }
    if(!room){ac.close();return alert("No free rooms right now.")}
  }
  const ar=ref(db,`rooms/${room}/auth/${uid}`);
  await set(ar,await H(room,pw));
  onDisconnect(ar).remove();
  const r=await claim();
  if(r!==1){
    ac.close();
    return alert(r<0?"This room is full (10 people).":"Wrong password, or the room could not be joined.");
  }
  $("#land").style.display="none";$("#app").style.display="flex";
  $("#rn").textContent="Room "+room;
  onChildAdded(ref(db,`rooms/${room}/signals/${uid}`),s=>{
    const m=s.val();remove(s.ref);
    queue=queue.then(()=>onSig(m)).catch(console.error);
  });
  onValue(ref(db,`rooms/${room}/seats`),s=>{
    seats={};
    s.forEach(c=>{const v=c.val();seats[v.uid]=v});
    for(const id in seats){
      if(id===uid)continue;
      const p=peers[id]||mkPeer(id);
      p.seat=seats[id];
      if(uid<id&&!p.pc)connect(p,true);
    }
    for(const id in peers)if(!seats[id]&&Date.now()-peers[id].born>5000)drop(id);
    render();
  });
  listSounds();loop();render();
}
$("#create").onclick=()=>go(true);
$("#join").onclick=()=>go(false);
$("#code").addEventListener("keydown",e=>e.key==="Enter"&&go(false));
</script>
</body>
</html>
